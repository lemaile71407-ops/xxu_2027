bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    controller_frequency: 15.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.2
      stateful: true
    FollowPath:
      # Official Nav2 MPPI with the holonomic (vx/vy/wz) motion model.
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"
      time_steps: 24
      # Must match the 15 Hz controller period on Nav2 Jazzy.
      model_dt: 0.0666667
      batch_size: 2000
      iteration_count: 1
      temperature: 0.4
      gamma: 0.015
      vx_std: 0.35
      vy_std: 0.35
      wz_std: 0.25
      # Gazebo navigation profile; keep velocity_smoother limits in sync.
      vx_min: -0.6
      vx_max: 0.6
      # Omni uses symmetric +/- vy_max; Jazzy does not declare vy_min.
      vy_max: 0.6
      wz_max: 0.6
      # Symmetric XY acceleration bounds avoid the slow sampling bias seen
      # with weaker positive acceleration in the fixed fake reference frame.
      ax_max: 0.8
      ax_min: -0.8
      ay_max: 0.8
      ay_min: -0.8
      az_max: 0.8
      # Cover the 1.6 s horizon, including diagonal translation.
      prune_distance: 2.8
      transform_tolerance: 1.0
      max_robot_pose_search_dist: 2.0
      retry_attempt_limit: 2
      regenerate_noises: false
      open_loop: false
      # Enable only while tuning; publishing the sampled trajectories costs CPU.
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: [
        "ConstraintCritic", "ObstaclesCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.0
        critical_weight: 25.0
        consider_footprint: false
        collision_cost: 100000.0
        collision_margin_distance: 0.10
        near_goal_distance: 0.5
        inflation_layer_name: "inflation_layer"
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.2
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 24.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 12
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 7.0
        offset_from_furthest: 5
        threshold_to_consider: 1.2
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        # No forward/reverse preference for a symmetric omnidirectional base.
        mode: 1
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      # A faster rolling costmap lets MPPI react to moving scan returns sooner.
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Cover the omni wheels as well as the 0.265 m body, including spin.
      robot_radius: 0.42
      transform_tolerance: 1.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 0.42 m swept envelope + 0.13 m soft clearance; decay applies to
        # soft cost, not collision protection or stopping distance.
        cost_scaling_factor: 7.0
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.42
      transform_tolerance: 1.0
      resolution: 0.05
      rolling_window: true
      width: 24
      height: 24
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 7.0
        inflation_radius: 0.75
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.35
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.2

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 1500

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.6, 0.6]
    min_velocity: [-0.6, -0.6, -0.6]
    max_accel: [0.8, 0.8, 0.8]
    max_decel: [-0.8, -0.8, -1.0]
    odom_topic: /odom
    odom_duration: 0.5
    stamp_smoothed_velocity_with_smoothing_time: true
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    # This is the only command stream allowed to leave Nav2.  The real/sim
    # bringup sends it through the final cmd_vel_watchdog before it reaches the
    # chassis controller.
    cmd_vel_out_topic: /cmd_vel_collision
    state_topic: collision_monitor_state
    transform_tolerance: 1.0
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 0.5
    # The dynamic footprint predicts the actual commanded motion.  The small
    # static zone makes a near-field obstacle an unconditional stop as well.
    polygons: ["FootprintApproach", "EmergencyStop"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 4
      visualize: false
      enabled: true
    EmergencyStop:
      type: "polygon"
      points: "[[0.42, 0.34], [0.42, -0.34], [-0.10, -0.34], [-0.10, 0.34]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: /collision_monitor/emergency_stop
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /scan
      min_height: 0.0
      max_height: 2.0
      enabled: true
